services:
  # ----------------------------------------------------------------------------
  # PostgreSQL with pgvector extension
  # ----------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: narrativelens-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-narrativelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-narrativelens}
      POSTGRES_DB: ${POSTGRES_DB:-narrativelens}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-narrativelens} -d ${POSTGRES_DB:-narrativelens}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - narrativelens-net

  # ----------------------------------------------------------------------------
  # Redis Cache & Task Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: narrativelens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - narrativelens-net

  # ----------------------------------------------------------------------------
  # FastAPI ML Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: narrativelens-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://narrativelens:narrativelens@db:5432/narrativelens}
      DATABASE_SYNC_URL: ${DATABASE_SYNC_URL:-postgresql://narrativelens:narrativelens@db:5432/narrativelens}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - model_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - narrativelens-net

  # ----------------------------------------------------------------------------
  # React / Vite Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: narrativelens-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
    networks:
      - narrativelens-net

volumes:
  postgres_data:
    name: narrativelens_postgres_data
  redis_data:
    name: narrativelens_redis_data
  model_cache:
    name: narrativelens_model_cache

networks:
  narrativelens-net:
    driver: bridge
